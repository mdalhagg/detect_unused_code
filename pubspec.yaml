name: detect_unused_code
description: Fast, zero-dependency Dart & Flutter dead code, assets, and packages remediation engine. Safely cleans unused classes, imports, assets, and dependencies.
version: 3.2.0
homepage: https://github.com/mdalhagg/detect_unused_code
repository: https://github.com/mdalhagg/detect_unused_code
issue_tracker: https://github.com/mdalhagg/detect_unused_code/issues

environment:
  sdk: '>=2.17.0 <4.0.0'

executables:
  detect_unused_code: detect_unused_code
  detect_unused: detect_unused_code

topics:
  - unused-code
  - dead-code
  - flutter
  - analyzer
  - code-quality
dev_dependencies:
  lints: ^5.1.1
  test: ^1.24.0
